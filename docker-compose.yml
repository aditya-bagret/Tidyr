services:
  db:
    image: postgres:16-alpine
    container_name: tidyr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tidyr
      POSTGRES_PASSWORD: tidyr
      POSTGRES_DB: tidyr
    ports:
      - '5432:5432'
    volumes:
      - tidyr-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the image's temporary init server only listens on the socket,
      # so this turns healthy only after the init scripts have finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U tidyr -d tidyr']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tidyr-db-data:
